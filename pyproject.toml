[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-intent-router"
version = "0.1.0"
description = "Lightweight first-stage intent router for Hermes (TF-IDF + MLP, with LR baseline)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "ZOO Company" }]
dependencies = [
    "scikit-learn>=1.3",
    "joblib>=1.3",
    "numpy>=1.24",
]

[project.scripts]
hermes-intent-router = "hermes_intent_router.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"